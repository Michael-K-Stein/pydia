[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pydia3"
version = "0.2.0"
description = "Python interface for Microsoft's Debug Interface Access (DIA) SDK."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Michael K. Steinberg", email = "m.kuper.steinberg@gmail.com" }]
requires-python = ">=3.12,<3.16"
keywords = ["pdb", "dia", "debug", "symbols", "windows"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: C++",
    "Topic :: Software Development :: Debuggers",
]

[project.urls]
Homepage = "https://github.com/Michael-K-Stein/pydia"
Issues = "https://github.com/Michael-K-Stein/pydia/issues"

[tool.setuptools]
packages = ["pydia3"]
include-package-data = false

[tool.setuptools.package-data]
pydia3 = ["*.pyd"]
