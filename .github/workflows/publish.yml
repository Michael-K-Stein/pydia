name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        id: py
        with:
          python-version: "3.12"
          architecture: x64

      - uses: microsoft/setup-msbuild@v3

      - name: Locate Python install
        shell: pwsh
        run: |
          $base = python -c "import sys; print(sys.base_prefix)"
          "PYTHON_HOME=$base" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Check release tag matches package version
        if: github.event_name == 'release'
        shell: pwsh
        run: |
          $tag = "${{ github.event.release.tag_name }}" -replace '^v', ''
          $ver = python -c "import tomllib; print(tomllib.load(open('setup/pyproject.toml','rb'))['project']['version'])"
          if ($tag -ne $ver) { throw "Tag '$tag' does not match setup/pyproject.toml version '$ver'" }

      - name: Build pydia.pyd
        run: msbuild pydia.sln /m /p:Configuration=Release-3.12 /p:Platform=x64 /t:pydia

      - name: Build sdist and wheel
        working-directory: x64/Release-3.12/package
        run: |
          python -m pip install build
          python -m build

      - name: Smoke-test the wheel
        shell: pwsh
        run: |
          python -m venv "$env:RUNNER_TEMP\smoke"
          & "$env:RUNNER_TEMP\smoke\Scripts\python.exe" -m pip install (Get-ChildItem x64/Release-3.12/package/dist/*.whl).FullName
          & "$env:RUNNER_TEMP\smoke\Scripts\python.exe" -I -c "import pydia; print(pydia.DataSource)"

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: x64/Release-3.12/package/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
