name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    strategy:
      # Run one version at a time, oldest first, and stop at the first failure.
      fail-fast: true
      max-parallel: 1
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        id: py
        with:
          python-version: ${{ matrix.python }}
          architecture: x64

      - uses: microsoft/setup-msbuild@v3

      - name: Locate Python install
        shell: pwsh
        run: |
          $base = python -c "import sys; print(sys.base_prefix)"
          "PYTHON_HOME=$base" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Check release tag matches package version
        if: github.event_name == 'release'
        shell: pwsh
        run: |
          $tag = "${{ github.event.release.tag_name }}" -replace '^v', ''
          $ver = python -c "import tomllib; print(tomllib.load(open('setup/pyproject.toml','rb'))['project']['version'])"
          if ($tag -ne $ver) { throw "Tag '$tag' does not match setup/pyproject.toml version '$ver'" }

      - name: Build pydia3.pyd
        run: msbuild pydia.sln /m /p:Configuration=Release-3.12 /p:Platform=x64 /t:pydia

      - name: Build sdist and wheel
        working-directory: x64/Release-3.12/package
        run: |
          python -m pip install build
          python -m build --wheel

      - name: Smoke-test the wheel
        shell: pwsh
        run: |
          python -m venv "$env:RUNNER_TEMP\smoke"
          & "$env:RUNNER_TEMP\smoke\Scripts\python.exe" -m pip install (Get-ChildItem x64/Release-3.12/package/dist/*.whl).FullName
          & "$env:RUNNER_TEMP\smoke\Scripts\python.exe" -I -c "import pydia3; print(pydia3.DataSource)"

      - name: Register the DIA SDK COM server
        shell: pwsh
        run: |
          $vs = vswhere -latest -property installationPath
          $dll = Join-Path $vs "DIA SDK\bin\amd64\msdia140.dll"
          if (-not (Test-Path $dll)) { throw "msdia140.dll not found at $dll" }
          regsvr32 /s $dll
          if ($LASTEXITCODE -ne 0) { throw "regsvr32 failed for $dll ($LASTEXITCODE)" }

      - name: Cache test resources
        uses: actions/cache@v5
        with:
          path: CTests/Resources
          key: test-resources-${{ hashFiles('.github/scripts/fetch_test_resources.py') }}

      - name: Fetch test resources
        run: python .github/scripts/fetch_test_resources.py

      - name: Run PyTests
        shell: pwsh
        working-directory: PyTests
        run: |
          python -m pip install pytest
          $env:PYTHONPATH = "$env:GITHUB_WORKSPACE\x64\Release-3.12\package"
          python -m pytest

      # DiaLib is independent of the Python version, so test it once.
      - name: Build and run CTests
        if: matrix.python == '3.12'
        shell: pwsh
        run: |
          msbuild pydia.sln /m /p:Configuration=CTest /p:Platform=x64 /t:CTests
          # The tests locate their resources relative to the working directory.
          Push-Location x64/Debug
          & "$(vswhere -latest -property installationPath)\Common7\IDE\CommonExtensions\Microsoft\TestWindow\vstest.console.exe" CTests.dll
          if ($LASTEXITCODE -ne 0) { throw "CTests failed" }
          Pop-Location

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.python }}
          path: x64/Release-3.12/package/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
