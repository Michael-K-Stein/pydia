name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  native-tests:
    name: CTests (DiaLib)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      - uses: microsoft/setup-msbuild@v3

      - name: Register the DIA SDK COM server
        shell: pwsh
        run: |
          $vs = vswhere -latest -property installationPath
          $dll = Join-Path $vs "DIA SDK\bin\amd64\msdia140.dll"
          if (-not (Test-Path $dll)) { throw "msdia140.dll not found at $dll" }
          regsvr32 /s $dll
          if ($LASTEXITCODE -ne 0) { throw "regsvr32 failed for $dll ($LASTEXITCODE)" }

      - name: Prepare test resources
        shell: pwsh
        run: ./setup/prepare_test_resources.ps1

      - name: Build CTests
        run: msbuild pydia.sln /m /p:Configuration=Release /p:Platform=x64 /t:CTests

      - name: Run CTests
        shell: pwsh
        run: |
          $vstest = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -find **\vstest.console.exe | Select-Object -First 1
          & $vstest x64\Release\CTests.dll

  python-tests:
    name: PyTests (pydia) - Python ${{ matrix.python }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          architecture: x64

      - uses: microsoft/setup-msbuild@v3

      - name: Locate Python install
        shell: pwsh
        run: |
          $base = python -c "import sys; print(sys.base_prefix)"
          "PYTHON_HOME=$base" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Register the DIA SDK COM server
        shell: pwsh
        run: |
          $vs = vswhere -latest -property installationPath
          $dll = Join-Path $vs "DIA SDK\bin\amd64\msdia140.dll"
          if (-not (Test-Path $dll)) { throw "msdia140.dll not found at $dll" }
          regsvr32 /s $dll
          if ($LASTEXITCODE -ne 0) { throw "regsvr32 failed for $dll ($LASTEXITCODE)" }

      - name: Prepare test resources
        shell: pwsh
        run: ./setup/prepare_test_resources.ps1

      - name: Build pydia extension
        run: msbuild pydia.sln /m /p:Configuration=Release-3.12 /p:Platform=x64 /t:pydia

      - name: Run PyTests
        shell: pwsh
        run: |
          $pkg = (Resolve-Path "x64/Release-3.12/package").Path
          $tests = (Resolve-Path "PyTests").Path
          $env:PYTHONPATH = "$pkg;$tests"
          python -m pytest PyTests
